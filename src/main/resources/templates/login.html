<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | BYTE SPACE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f8f5ef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: 1px solid #e8e0d5;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 12px 35px rgba(32, 43, 70, 0.10);
            overflow: hidden;
        }

        .brand {
            color: #202b46;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand span {
            color: #c87556;
        }

        .subtitle {
            color: #777777;
            font-size: 14px;
        }

        .form-label {
            color: #202b46;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            min-height: 48px;
            border: 1px solid #dedede;
            border-radius: 10px;
            padding: 12px 14px;
        }

        .form-control:focus {
            border-color: #c87556;
            box-shadow: 0 0 0 3px rgba(200, 117, 86, 0.15);
        }

        .btn-login {
            width: 100%;
            min-height: 48px;
            background: #202b46;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #344466;
            color: white;
        }

        .register-link {
            color: #c87556;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .input-group .form-control {
            border-radius: 10px 0 0 10px;
        }

        .input-group .btn {
            border: 1px solid #dedede;
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: #202b46;
        }
    </style>
</head>

<body>

<div class="card login-card">
    <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
            <div class="brand">BYTE <span>SPACE</span></div>
            <p class="subtitle mt-2 mb-0">Welcome back! Sign in to continue.</p>
        </div>

        <div th:if="${param.registered != null}"
             class="alert alert-success" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            Registration successful! You can now log in.
        </div>

        <div th:if="${param.error != null}"
             class="alert alert-danger" role="alert">
            Invalid username/email or password. Please try again.
        </div>

        <div th:if="${param.logout != null}"
             class="alert alert-info" role="alert">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username or Email
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Enter your username or email"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>

                <div class="input-group">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           autocomplete="current-password"
                           required>

                    <button class="btn"
                            type="button"
                            id="togglePassword"
                            aria-label="Show password">
                        <i class="bi bi-eye" id="passwordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
            </button>

        </form>

        <div class="text-center mt-4">
            <span class="subtitle">Don't have an account?</span>
            <a th:href="@{/register}" class="register-link ms-1">
                Create account
            </a>
        </div>

    </div>
</div>

<script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");
    const passwordIcon = document.getElementById("passwordIcon");

    toggleButton.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        passwordIcon.className = isPassword ? "bi bi-eye-slash" : "bi bi-eye";
        toggleButton.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password"
        );
    });
</script>

</body>
</html>
