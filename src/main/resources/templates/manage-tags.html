<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Tags | BYTE SPACE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        :root {
            --cream: #f7f4ee;
            --navy: #202c3c;
            --navy-light: #2d3b4f;
            --terracotta: #bc735c;
            --text: #343a40;
            --muted: #858585;
            --border: #e9e2d8;
            --white: #ffffff;
            --danger: #b84d4d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: var(--navy);
            padding: 18px 0;
            box-shadow: 0 3px 14px rgba(32, 44, 60, .10);
        }

        .navbar-brand {
            color: var(--white);
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-decoration: none;
        }

        .navbar-brand span {
            color: #d89a83;
        }

        .home-btn {
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 9px;
            padding: 9px 15px;
            text-decoration: none;
            transition: .2s;
        }

        .home-btn:hover {
            color: var(--navy);
            background: var(--white);
        }

        /* Main layout */
        .page-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* Dashboard back link */
        .dashboard-back {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            margin-bottom: 30px;
            background: var(--white);
            color: var(--navy);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(32, 44, 60, .035);
            transition: .2s;
        }

        .dashboard-back:hover {
            color: var(--white);
            background: var(--navy);
            border-color: var(--navy);
            transform: translateX(-3px);
        }

        .dashboard-back i {
            font-size: 17px;
        }

        .eyebrow {
            color: var(--terracotta);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--navy);
            font-size: clamp(28px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -.7px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        /* Content cards */
        .content-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 26px;
            margin-bottom: 22px;
            box-shadow: 0 5px 18px rgba(32, 44, 60, .035);
        }

        .section-title {
            color: var(--navy);
            font-size: 17px;
            font-weight: 750;
            margin-bottom: 18px;
        }

        /* Add tag form */
        .tag-form {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
        }

        .tag-input {
            flex: 1;
            min-width: 0;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #fdfcf9;
            color: var(--text);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .tag-input:focus {
            border-color: var(--terracotta);
            box-shadow: 0 0 0 3px rgba(188, 115, 92, .12);
        }

        .btn-add {
            flex-shrink: 0;
            padding: 12px 18px;
            background: var(--navy);
            color: var(--white);
            border: 1px solid var(--navy);
            border-radius: 9px;
            font-weight: 600;
            transition: .2s;
        }

        .btn-add:hover {
            background: var(--terracotta);
            border-color: var(--terracotta);
            color: var(--white);
        }

        /* Tags table */
        .table-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .table-heading .section-title {
            margin-bottom: 0;
        }

        .tag-count {
            background: #f5e8e1;
            color: #9f5c47;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .table-responsive {
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }

        thead th {
            padding: 15px 18px;
            background: #f8f5ef;
            color: var(--navy);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
            white-space: nowrap;
        }

        tbody td {
            padding: 15px 18px;
            border-bottom: 1px solid #f0ece5;
            vertical-align: middle;
            font-size: 14px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fdfbf7;
        }

        .tag-id {
            color: var(--muted);
            font-size: 13px;
        }

        .tag-name {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 7px;
            background: #f5e8e1;
            color: #92533f;
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .delete-form {
            margin: 0;
        }

        .btn-delete {
            padding: 8px 12px;
            background: #fff5f3;
            color: var(--danger);
            border: 1px solid #f0d6d0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            transition: .2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: var(--white);
        }

        /* Empty state */
        .empty-state {
            padding: 35px 15px;
            color: var(--muted);
            text-align: center;
        }

        .empty-state i {
            display: block;
            font-size: 30px;
            color: #c9b9a9;
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .page-container {
                padding: 22px 14px 45px;
            }

            .navbar {
                padding: 15px 0;
            }

            .navbar-brand {
                font-size: 18px;
            }

            .dashboard-back {
                margin-bottom: 25px;
            }

            .content-card {
                padding: 18px;
            }

            .tag-form {
                align-items: stretch;
                flex-direction: column;
            }

            .btn-add {
                width: 100%;
            }

            thead th,
            tbody td {
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center">

        <a class="navbar-brand" th:href="@{/}">
            BYTE <span>SPACE</span>
        </a>

        <a th:href="@{/}" class="home-btn">
            <i class="bi bi-house-door me-1"></i>
            View Website
        </a>

    </div>
</nav>

<main class="page-container">

    <!-- Back to Dashboard: visible near the top -->
    <a class="dashboard-back" th:href="@{/admin}">
        <i class="bi bi-arrow-left"></i>
        Back to Admin Dashboard
    </a>

    <div class="eyebrow">Administration</div>

    <h1>Manage Tags</h1>

    <p class="subtitle">
        Create and manage tags to help readers discover related articles.
    </p>

    <!-- Add Tag -->
    <section class="content-card">

        <h2 class="section-title">
            <i class="bi bi-plus-circle me-2" style="color: var(--terracotta);"></i>
            Add New Tag
        </h2>

        <form th:action="@{/admin/tags/save}"
              method="post"
              class="tag-form">

            <input type="text"
                   name="name"
                   class="tag-input"
                   placeholder="Enter a tag name..."
                   maxlength="100"
                   required>

            <button type="submit" class="btn-add">
                <i class="bi bi-plus-lg me-1"></i>
                Add Tag
            </button>

        </form>

    </section>

    <!-- Existing Tags -->
    <section class="content-card">

        <div class="table-heading">

            <h2 class="section-title">
                <i class="bi bi-tags me-2" style="color: var(--terracotta);"></i>
                Existing Tags
            </h2>

            <span class="tag-count"
                  th:text="${#lists.size(tags)} + ' tags'">
                0 tags
            </span>

        </div>

        <div class="table-responsive">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tag Name</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="tag : ${tags}">

                    <td class="tag-id" th:text="${tag.id}">1</td>

                    <td>
                        <span class="tag-name" th:text="${tag.name}">Java</span>
                    </td>

                    <td>
                        <form th:action="@{/admin/tags/delete/{id}(id=${tag.id})}"
                              method="post"
                              class="delete-form">

                            <button type="submit" class="btn-delete">
                                <i class="bi bi-trash3 me-1"></i>
                                Delete
                            </button>

                        </form>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(tags)}">
                    <td colspan="3">

                        <div class="empty-state">
                            <i class="bi bi-tags"></i>
                            <div class="fw-semibold mb-1">No tags yet</div>
                            <div class="small">
                                Add your first tag using the form above.
                            </div>
                        </div>

                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

    <footer class="footer">
        BYTE SPACE · Content Management
    </footer>

</main>

</body>
</html>
