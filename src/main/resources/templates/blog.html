<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Blog Details</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body{

            background:#f8f9fa;

        }


        .navbar{

            box-shadow:0 3px 12px rgba(0,0,0,.08);

        }


        .blog-container{

            max-width:900px;

        }


        .blog-image{

            width:100%;

            height:400px;

            object-fit:cover;

            border-radius:20px;

        }


        .article-card{

            background:white;

            border:none;

            border-radius:20px;

            padding:30px;

            box-shadow:0 5px 20px rgba(0,0,0,.08);

        }


        .author{

            color:#6c757d;

        }


        .comment-box{

            background:white;

            border-radius:15px;

            padding:25px;

            box-shadow:0 4px 15px rgba(0,0,0,.07);

        }


        .form-control{

            border-radius:10px;

        }


    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">

            Mini Blog

        </a>


        <div>

            <a href="/" class="btn btn-outline-light btn-sm">

                Home

            </a>

        </div>

    </div>

</nav>


<div class="container blog-container my-5">


    <div class="article-card">


        <img th:src="${blog.image}"
             class="blog-image"
             alt="Blog Image">


        <h1 class="mt-4 fw-bold"
            th:text="${blog.title}">

            Blog Title

        </h1>


        <hr>


        <p th:text="${blog.content}">

            Blog Content

        </p>


    </div>

    <div class="comment-box mt-5">

        <h4 class="mb-4">

            <i class="bi bi-chat-dots text-primary"></i>

            Comments

        </h4>


        <div th:each="comment : ${comments}"
             class="border rounded p-3 mb-3">

            <p class="fw-bold mb-2"
               th:text="${comment.authorName}">
            </p>

            <p class="mb-0"
               th:text="${comment.message}">
            </p>

        </div>


        <hr>



        <div sec:authorize="isAuthenticated()">

            <h5 class="mb-3">Add Comment</h5>

            <form th:action="@{/blog/{id}/comment(id=${blog.id})}"
                  method="post">

                <div class="mb-3">
            <textarea
                    name="message"
                    class="form-control"
                    rows="4"
                    placeholder="Write your comment..."
                    required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Send Comment
                </button>

            </form>

        </div>

        <div sec:authorize="isAnonymous()">

            <h5 class="mb-3">Add Comment</h5>

            <p>
                Please <a th:href="@{/login}">login</a>
                to leave a comment.
            </p>

        </div>



    </div>


</div>


<footer class="bg-dark text-white mt-5 py-4">


    <div class="container text-center">


        <h5>

            Mini Blog

        </h5>


        <p class="mb-1">

            Share knowledge with everyone.

        </p>


        <small>

            © 2026 Mini Blog

        </small>


    </div>


</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
