<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Blogs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{

            background:#f5f5f5;

        }

        .card{

            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);

        }

    </style>

</head>


<body>


<div class="container mt-5">


    <div class="d-flex justify-content-between align-items-center mb-4">


        <h2>
            Manage Blogs
        </h2>


        <div>

            <a href="/admin"
               class="btn btn-secondary me-2">

                Back To Admin

            </a>


            <a href="/admin/blogs/add"
               class="btn btn-primary">

                Add Blog

            </a>

        </div>


    </div>



    <div class="card p-4">


        <div class="table-responsive">


            <table class="table table-hover">


                <thead class="table-dark">

                <tr>

                    <th>Title</th>

                    <th>Image</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="blog : ${blogs}">


                    <td th:text="${blog.title}">
                        Title
                    </td>


                    <td>

                        <img th:src="${blog.image}"
                             width="80"
                             height="50">

                    </td>


                    <td>


                        <span th:if="${blog.approved}"
                              class="badge bg-success">

                            Approved

                        </span>


                        <span th:unless="${blog.approved}"
                              class="badge bg-warning">

                            Waiting

                        </span>


                    </td>


                    <td>


                        <a th:if="${!blog.approved}"
                           th:href="@{/admin/blogs/approve/{id}(id=${blog.id})}"
                           class="btn btn-success btn-sm">

                            Approve

                        </a>


                        <a th:href="@{/admin/blogs/delete/{id}(id=${blog.id})}"
                           class="btn btn-danger btn-sm">

                            Delete

                        </a>


                    </td>


                </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>


</body>

</html>
