<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Manage Blogs | BYTE SPACE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        :root {
            --cream: #f8f5ef;
            --navy: #202b46;
            --terracotta: #c87556;
            --sage: #dce8dc;
            --sage-text: #42664a;
            --gold: #f5e8c8;
            --gold-text: #8b6827;
            --muted: #777b87;
            --white: #ffffff;
            --border: #e9e3d9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--navy);
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: var(--navy);
            padding: 18px 0;
        }

        .brand {
            color: var(--white);
            font-size: 23px;
            font-weight: 800;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .brand span {
            color: var(--terracotta);
        }

        .page-container {
            max-width: 1250px;
            margin: 45px auto;
            padding: 0 22px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: var(--muted);
            margin: 0;
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-custom {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .btn-back {
            color: var(--navy);
            background: var(--white);
            border-color: var(--border);
        }

        .btn-back:hover {
            background: var(--navy);
            color: var(--white);
        }

        .btn-add {
            background: var(--terracotta);
            color: var(--white);
        }

        .btn-add:hover {
            background: #ad6045;
            color: var(--white);
            transform: translateY(-1px);
        }

        .blogs-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 28px rgba(32, 43, 70, 0.05);
        }

        .card-heading {
            padding: 22px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .card-heading h2 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
        }

        .count-badge {
            background: #f3e6df;
            color: #99553d;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .table {
            margin: 0;
            vertical-align: middle;
        }

        .table thead th {
            background: #fbf9f5;
            color: var(--muted);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.7px;
            padding: 17px 20px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .table tbody td {
            padding: 18px 20px;
            border-bottom: 1px solid #f0ece5;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        .table tbody tr:hover {
            background: #fdfbf8;
        }

        .blog-title {
            min-width: 180px;
            font-weight: 700;
            color: var(--navy);
        }

        .blog-image {
            width: 92px;
            height: 62px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--cream);
        }

        .no-image {
            width: 92px;
            height: 62px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #f3eee6;
            color: var(--muted);
            font-size: 23px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-approved {
            background: var(--sage);
            color: var(--sage-text);
        }

        .status-pending {
            background: var(--gold);
            color: var(--gold-text);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            min-width: 210px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
        }

        .edit-btn {
            background: #e6eaf2;
            color: var(--navy);
        }

        .edit-btn:hover {
            background: #d5dceb;
            color: var(--navy);
        }

        .approve-btn {
            background: var(--sage);
            color: var(--sage-text);
        }

        .approve-btn:hover {
            background: #c8ddc9;
            color: var(--sage-text);
        }

        .delete-btn {
            background: #f8e4df;
            color: #a34335;
        }

        .delete-btn:hover {
            background: #f1d0c8;
            color: #a34335;
        }

        .empty-state {
            padding: 65px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty-state i {
            display: block;
            font-size: 45px;
            color: var(--terracotta);
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: var(--navy);
            font-size: 20px;
            font-weight: 800;
        }

        .empty-state p {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .page-container {
                margin: 28px auto;
                padding: 0 12px;
            }

            .page-title {
                font-size: 26px;
            }

            .page-header {
                align-items: flex-start;
            }

            .card-heading {
                padding: 18px;
            }

            .table thead th,
            .table tbody td {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="brand" th:href="@{/}">
            BYTE <span>SPACE</span>
        </a>
    </div>
</nav>

<main class="page-container">

    <div class="page-header">
        <div>
            <h1 class="page-title">Manage Blogs</h1>
            <p class="page-subtitle">
                Create, review, edit and manage your blog articles.
            </p>
        </div>

        <div class="header-actions">
            <a th:href="@{/admin}" class="btn-custom btn-back">
                <i class="bi bi-arrow-left"></i>
                Back to Admin
            </a>

            <a th:href="@{/admin/blogs/add}" class="btn-custom btn-add">
                <i class="bi bi-plus-lg"></i>
                Add Blog
            </a>
        </div>
    </div>

    <section class="blogs-card">

        <div class="card-heading">
            <h2>
                <i class="bi bi-journal-richtext me-2"></i>
                All Blog Articles
            </h2>

            <span class="count-badge"
                  th:text="|${#lists.size(blogs)} blogs|">
                0 blogs
            </span>
        </div>

        <div class="table-responsive"
             th:if="${not #lists.isEmpty(blogs)}">

            <table class="table table-hover">

                <thead>
                <tr>
                    <th>Title</th>
                    <th>Image</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="blog : ${blogs}">

                    <td>
                        <div class="blog-title"
                             th:text="${blog.title}">
                            Blog title
                        </div>
                    </td>

                    <td>
                        <img th:if="${blog.image != null and !#strings.isEmpty(blog.image)}"
                             th:src="${blog.image}"
                             th:alt="${blog.title}"
                             class="blog-image">

                        <span th:if="${blog.image == null or #strings.isEmpty(blog.image)}"
                              class="no-image">
                            <i class="bi bi-image"></i>
                        </span>
                    </td>

                    <td>
                        <span th:if="${blog.approved}"
                              class="status-badge status-approved">
                            <i class="bi bi-check-circle-fill"></i>
                            Approved
                        </span>

                        <span th:unless="${blog.approved}"
                              class="status-badge status-pending">
                            <i class="bi bi-clock-fill"></i>
                            Waiting for approval
                        </span>
                    </td>

                    <td>
                        <div class="actions">

                            <a th:href="@{/admin/blogs/edit/{id}(id=${blog.id})}"
                               class="action-btn edit-btn">
                                <i class="bi bi-pencil-square"></i>
                                Edit
                            </a>


                            <form th:if="${not blog.approved}"
                                  th:action="@{/admin/blogs/approve/{id}(id=${blog.id})}"
                                  method="post"
                                  style="display: inline;">

                                <button type="submit" class="action-btn approve-btn">
                                    <i class="bi bi-check-lg"></i>
                                    Approve
                                </button>

                            </form>


                            <a th:href="@{/admin/blogs/delete/{id}(id=${blog.id})}"
                               class="action-btn delete-btn"
                               onclick="return confirm('Are you sure you want to delete this blog?');">
                                <i class="bi bi-trash"></i>
                                Delete
                            </a>

                        </div>
                    </td>

                </tr>
                </tbody>

            </table>
        </div>

        <div class="empty-state"
             th:if="${#lists.isEmpty(blogs)}">

            <i class="bi bi-journal-x"></i>

            <h3>No blogs yet</h3>

            <p>Start by creating your first blog article.</p>

            <a th:href="@{/admin/blogs/add}"
               class="btn-custom btn-add">
                <i class="bi bi-plus-lg"></i>
                Create First Blog
            </a>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
