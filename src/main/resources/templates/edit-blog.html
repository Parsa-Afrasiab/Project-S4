<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Blog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow-sm">

        <h2 class="mb-4">Edit Blog</h2>

        <form th:action="@{/admin/blogs/update}"
              th:object="${blog}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control"
                       th:field="*{title}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="text" class="form-control"
                       th:field="*{image}">
            </div>

            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea class="form-control" rows="8"
                          th:field="*{content}" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Categories</label>

                <div th:each="category : ${categories}" class="form-check">
                    <input type="checkbox"
                           class="form-check-input"
                           name="categories"
                           th:value="${category.id}"
                           th:checked="${blog.categories.contains(category)}">

                    <label class="form-check-label"
                           th:text="${category.name}"></label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Tags</label>

                <div th:each="tag : ${tags}" class="form-check">
                    <input type="checkbox"
                           class="form-check-input"
                           name="tags"
                           th:value="${tag.id}"
                           th:checked="${blog.tags.contains(tag)}">

                    <label class="form-check-label"
                           th:text="${tag.name}"></label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Update Blog
            </button>

            <a href="/admin/blogs" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

</body>
</html>
