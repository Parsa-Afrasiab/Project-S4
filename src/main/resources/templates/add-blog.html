<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Blog</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f5f5f5;

        }


        .card{

            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);

        }


        textarea{

            resize:none;

        }


    </style>


</head>


<body>


<div class="container mt-5">


    <div class="card p-4">


        <h2 class="mb-4">

            Add New Blog

        </h2>



        <form th:action="@{/admin/blogs/save}"
              th:object="${blog}"
              method="post">


            <div class="mb-3">


                <label class="form-label">

                    Title

                </label>


                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       placeholder="Enter blog title">


            </div>



            <div class="mb-3">


                <label class="form-label">

                    Image URL

                </label>


                <input type="text"
                       class="form-control"
                       th:field="*{image}"
                       placeholder="Enter image url">


            </div>



            <div class="mb-3">


                <label class="form-label">

                    Content

                </label>


                <textarea class="form-control"
                          rows="8"
                          th:field="*{content}"
                          placeholder="Write your blog content"></textarea>


            </div>



            <button type="submit"
                    class="btn btn-success">

                Save Blog

            </button>


            <a href="/admin/blogs"
               class="btn btn-secondary">

                Back

            </a>


        </form>


    </div>


</div>


</body>

</html>
