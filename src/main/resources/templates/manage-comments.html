<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Comments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="mb-4">

        Manage Comments

    </h2>


    <a href="/admin" class="btn btn-secondary mb-4">

        Back

    </a>


    <table class="table table-bordered table-hover bg-white">

        <thead>

        <tr>

            <th>ID</th>

            <th>Comment</th>

            <th>Status</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="comment : ${comments}">

            <td th:text="${comment.id}"></td>

            <td th:text="${comment.message}"></td>

            <td>

                <span th:if="${comment.approved}"
                      class="badge bg-success">

                    Approved

                </span>

                <span th:unless="${comment.approved}"
                      class="badge bg-warning">

                    Pending

                </span>

            </td>

            <td>

                <form th:action="@{/admin/comments/approve/{id}(id=${comment.id})}"
                      method="post"
                      style="display:inline;">

                    <button class="btn btn-success btn-sm">

                        Approve

                    </button>

                </form>

                <form th:action="@{/admin/comments/delete/{id}(id=${comment.id})}"
                      method="post"
                      style="display:inline;">

                    <button class="btn btn-danger btn-sm">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
