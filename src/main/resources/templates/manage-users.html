<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Byte Space</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin-top: 50px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="user-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Manage Users</h2>
            <a th:href="@{/admin}" class="btn btn-outline-secondary">
                Back to Dashboard
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.role}"></td>

                    <td>
                        <span th:if="${user.enabled}"
                              class="badge text-bg-success">Active</span>
                        <span th:unless="${user.enabled}"
                              class="badge text-bg-danger">Inactive</span>
                    </td>

                    <td>
                        <form th:if="${user.enabled}"
                              th:action="@{/admin/users/{id}/disable(id=${user.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-danger">
                                Disable
                            </button>
                        </form>

                        <form th:unless="${user.enabled}"
                              th:action="@{/admin/users/{id}/enable(id=${user.id})}"
                              method="post">
                            <button type="submit" class="btn btn-sm btn-success">
                                Enable
                            </button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="7" class="text-center text-muted">
                        No users found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
