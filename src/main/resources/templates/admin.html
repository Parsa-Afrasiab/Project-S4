<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Panel</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f5f5f5;

        }


        .admin-card{

            border:none;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);

        }


        .number{

            font-size:35px;
            font-weight:bold;

        }


        .menu a{

            text-decoration:none;
            margin-right:10px;

        }


    </style>

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">

            Mini Blog Admin

        </a>


        <a href="/" class="btn btn-outline-light">

            Home

        </a>

    </div>

</nav>



<div class="container mt-5">


    <h2 class="mb-4">

        Admin Panel

    </h2>


    <div class="menu mb-4">


        <a href="/admin/blogs" class="btn btn-primary">

            Manage Blogs

        </a>


        <a href="/admin/comments" class="btn btn-warning">

            Manage Comments

        </a>


    </div>



    <div class="row g-4">


        <div class="col-md-4">


            <div class="card admin-card p-4 text-center">


                <h5>

                    Users

                </h5>


                <div class="number text-primary"
                     th:text="${userCount}">

                    0

                </div>


            </div>


        </div>



        <div class="col-md-4">


            <div class="card admin-card p-4 text-center">


                <h5>

                    Blogs

                </h5>


                <div class="number text-success"
                     th:text="${blogCount}">

                    0

                </div>


            </div>


        </div>




        <div class="col-md-4">


            <div class="card admin-card p-4 text-center">


                <h5>

                    Comments

                </h5>


                <div class="number text-danger"
                     th:text="${commentCount}">

                    0

                </div>


            </div>


        </div>


    </div>


</div>



</body>

</html>
